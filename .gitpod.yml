tasks:
    - init: |
          npm install
          npm run build
          gp sync-done installation
    - init: gp sync-await installation
      command: npm start
      env:
          HOST: 0.0.0.0
    - init: gp sync-await installation
      command: gp ports await 8080 && gp preview --external $(gp url 8080)

ports:
    - port: 8080
      name: WebViz
      onOpen: open-browser
      visibility: private
